seed_everything: 42
name: ColliderML_LearnedSorter

data:
  train_dir: /share/rcif2/ljohnson/data/colliderml/v1/pu200/train/
  val_dir: /share/rcif2/ljohnson/data/colliderml/v1/pu200/val/
  test_dir: /share/rcif2/ljohnson/data/colliderml/v1/pu200/val/

  num_workers: 10
  num_train: -1
  num_test: -1
  num_val: -1

  event_type: ttbar

  # Reconstructable-particle definition (matches the tracking/filtering cuts).
  particle_min_pt: 0.9
  particle_max_abs_eta: 4.0
  particle_include_charged: true
  particle_include_neutral: false

  particle_hit_cuts:
    charged_hadron:
      min_num_sihit: 3
    electron:
      min_num_sihit: 3
    muon:
      min_num_sihit: 3
    tau:
      min_num_sihit: 3

  return_calohits: false
  return_tracks: false

  # Full pixel (barrel + endcap) so the sorter learns the whole detector, matching
  # the aspect-ratio / benchmark study.
  sihit_volume_ids: [16, 17, 18]
  sihit_max_abs_eta: 4.0

  max_num_particles: 6000

  # Hit-filter mode: emits sihit_on_valid_particle + sihit_particle_id per hit and
  # skips the dense particle->sihit matrix / particle padding the sorter never uses.
  hit_filter: true

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: colliderml_sorter

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-5
    max: 5e-4
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.SorterModel
    init_args:
      input_name: sihit
      # Raw per-hit fields the ordering tasks read as truth labels.
      passthrough_fields: [particle_id]

      sorter:
        class_path: hepattn.utils.sorter.LearnedSorter
        init_args:
          input_sort_field: phi          # warmup fallback (unused: no encoder, warmup_steps=0)
          # Continuous coordinates (no phi seam) + r/eta for region-adaptive ordering.
          score_fields: [x, y, z, r, eta]
          hidden_dims: [64, 64]
          warmup_steps: 0
          score_field: sort_score

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.SupervisedOrderingTask
              init_args:
                name: ordering
                input_object: sihit
                score_field: sort_score
                object_index_field: sihit_particle_id
                include_field: sihit_on_valid_particle
                valid_field: sihit_valid
                circular: true
                window: 512
                losses:
                  objectness: 1.0
                  distribution: 1.0
