seed_everything: 42
name: ColliderML_HitFiltering_Lite

data:
  train_dir: /share/rcif2/maxhart/data/colliderml/v1/pu200/
  val_dir: /share/rcif2/maxhart/data/colliderml/v1/pu200/
  test_dir: /share/rcif2/maxhart/data/colliderml/v1/pu200/

  num_workers: 10
  num_train: -1
  num_test: -1
  num_val: -1

  event_type: ttbar

  # Minimum pT for a particle to be deemed reconstructable in GeV
  particle_min_pt: 0.9
  particle_max_abs_eta: 1.0

  particle_include_charged: true
  particle_include_neutral: false

  particle_hit_cuts:
    charged_hadron:
      min_num_sihit: 3
      min_num_hcal: 0
    neutral_hadron:
      min_num_hcal: 0
    electron:
      min_num_sihit: 3
      min_num_ecal: 0
    photon:
      min_num_ecal: 0
    muon:
      min_num_sihit: 3
    tau:
      min_num_sihit: 3

  return_calohits: false
  return_tracks: false

  # Restrict to pixel barrel (volume 17) to match tracking config
  sihit_volume_ids: [17]
  sihit_max_abs_eta: 1.0

  # Set high to avoid truncating reconstructable particles, which would
  # mislabel their hits as noise. No num_queries coupling for hit filtering.
  max_num_particles: 6000

trainer:
  # Training stuff here
  max_epochs: 20
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: True

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: colliderml_filtering

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: false
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: sihit
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - eta
                  - phi
                  - layer_id
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    output_size: &dim 256
                posenc:
                  class_path: hepattn.models.FourierPositionEncoder
                  init_args:
                    input_name: sihit
                    fields:
                      - r
                      - eta
                      - phi
                    dim: *dim
                    scale: 0.1
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 10
          dim: *dim
          attn_type: flash
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: RMSNorm

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: hit_filter
                input_object: sihit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
                loss_fn: bce
