seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  logger: false
  callbacks:
  - class_path: hepattn.callbacks.Compile
    init_args:
      dynamic: true
      mode: null
      skip_dynamic_cudagraphs: true
  - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 50
      process_position: 0
      leave: false
  fast_dev_run: false
  max_epochs: 30
  min_epochs: null
  max_steps: 600
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: 0
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  enable_checkpointing: false
  enable_progress_bar: true
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: <scratch>/timing/logs
  model_registry: null
model:
  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.InputNet
            init_args:
              input_name: hit
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 17
                  output_size: 256
                  hidden_layers:
                  - 128
                  hidden_dim_scale: 2
                  activation:
                    class_path: hepattn.models.SwiGLU
                  final_activation: null
                  dropout: 0.0
                  bias: true
              fields:
              - x
              - y
              - z
              - r
              - eta
              - phi
              - u
              - v
              - s
              - charge_frac
              - leta
              - lphi
              - lx
              - ly
              - lz
              - geta
              - gphi
              posenc:
                class_path: hepattn.models.PositionEncoder
                init_args:
                  input_name: hit
                  fields:
                  - r
                  - eta
                  - phi
                  dim: 256
                  sym_fields: null
                  alpha: 1000
                  base: 100
              input_dtype: null
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: 256
          attn_type: flash
          window_size: 512
          window_wrap: true
          or_n_hashes: null
          or_num_regions: 100
          or_base_seed: 0
          or_impl: sorted
          score_mod: null
          value_residual: false
          num_register_tokens: null
          attn_kwargs:
            bias: false
          norm: CustomLayerNorm
          layer_scale: null
          drop_path: 0.0
          qkv_norm: false
          hybrid_norm: true
          dense_kwargs:
            activation: SwiGLU
      decoder:
        class_path: hepattn.models.MaskFormerDecoder
        init_args:
          num_queries: 3900
          decoder_layer_config:
            dim: 256
            norm: CustomLayerNorm
            hybrid_norm: true
            dense_kwargs:
              activation: SwiGLU
            attn_kwargs:
              bias: false
            bidirectional_ca: false
          num_decoder_layers: 3
          mask_attention: true
          use_query_masks: false
          posenc: null
          local_strided_attn: false
          window_size: 512
          window_wrap: true
          block_size: 128
          unified_decoding: false
          phi_shift: 0.0
          unmask_all_false: true
          dynamic_queries: true
          dynamic_query_source: hit
          debug: false
          intermediate_tasks: true
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.task.ObjectClassificationTask
            init_args:
              name: track_valid
              input_object: query
              output_object: track
              target_object: particle
              losses:
                object_bce: 0.1
              costs:
                object_bce: 0.1
              net: null
              dim: 256
              num_classes: 1
              class_weights: null
              null_weight: 1.0
              mask_queries: false
              has_intermediate_loss: true
              has_first_layer_loss: false
          - class_path: hepattn.models.task.ObjectHitMaskTask
            init_args:
              name: track_hit_valid
              input_constituent: hit
              input_object: query
              output_object: track
              target_object: particle
              losses:
                mask_dice: 2.0
                mask_focal: 25.0
              costs:
                mask_dice: 2.0
                mask_focal: 25.0
              dim: 256
              object_net: null
              constituent_net: null
              loss_kwargs: null
              cost_kwargs: null
              null_weight: 1.0
              mask_attn: true
              target_field: valid
              logit_scale: 1.0
              pred_threshold: 0.5
              mask_attention_threshold: null
              has_intermediate_loss: true
          - class_path: hepattn.models.task.IoUPredictionTask
            init_args:
              name: track_iou
              input_object: query
              mask_task_name: track_hit_valid
              mask_logit_key: track_hit_logit
              target_mask_key: particle_hit
              dim: 256
              loss_weight: 1.0
              input_constituent: null
              target_object: null
              target_field: valid
              loss: mse
              huber_delta: 0.1
              target_mode: soft
              target_threshold: 0.5
              valid_target_weight: 1.0
              null_target_weight: 1.0
      dim: 256
      target_object: particle
      pooling: null
      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: lap1015_late
          adaptive_solver: false
          adaptive_check_interval: 1000
          parallel_solver: true
          parallel_backend: process
          n_jobs: 4
          verbose: false
          prepare_on_device: true
          trim_padded_queries: true
      input_sort_field: phi
      sorter: null
      unified_decoding: false
      dynamic_query_source: hit
      encoder_tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.task.ClassificationTask
            init_args:
              name: query_init
              input_object: hit
              classes:
              - is_first
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  output_size: 1
                  hidden_layers:
                  - 256
                  hidden_dim_scale: 2
                  activation: null
                  final_activation: null
                  dropout: 0.0
                  bias: true
              output_object: null
              target_object: null
              class_weights: null
              loss_weight: 1.0
              threshold: 0.3
              multilabel: false
              permute_loss: false
              has_intermediate_loss: true
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-05
    pct_start: 0.02
    skip_scheduler: false
    weight_decay: 1.0e-05
  optimizer: Lion
  mtl: false
data:
  train_dir: /eos/user/l/ljohnson/datasets/TrackML_UCL/train/
  val_dir: /eos/user/l/ljohnson/datasets/TrackML_UCL/val/
  num_workers: 10
  num_train: -1
  num_val: -1
  num_test: -1
  test_dir: /eos/user/l/ljohnson/datasets/TrackML_UCL/test/
  pin_memory: true
  hit_eval_train: /eos/user/l/ljohnson/datasets/TrackML_UCL/filter_evals/eta4pt600/epoch=070-val_loss=0.20153_train_eval.h5
  hit_eval_val: /eos/user/l/ljohnson/datasets/TrackML_UCL/filter_evals/eta4pt600/epoch=070-val_loss=0.20153_val_eval.h5
  hit_eval_test: /eos/user/l/ljohnson/datasets/TrackML_UCL/filter_evals/eta4pt600/epoch=070-val_loss=0.20153_test_eval.h5
  paper_compatible_test_output: true
  inputs:
    hit:
    - x
    - y
    - z
    - r
    - s
    - eta
    - phi
    - u
    - v
    - s
    - charge_frac
    - leta
    - lphi
    - lx
    - ly
    - lz
    - geta
    - gphi
  targets:
    hit:
    - is_first
    particle:
    - pt
    - eta
    - phi
  hit_volume_ids:
  - 7
  - 8
  - 9
  feature_volume_ids: null
  particle_min_pt: 0.6
  particle_train_min_pt: null
  particle_max_abs_eta: 4.0
  particle_min_num_hits: 3
  particle_train_min_num_hits: null
  event_max_num_particles: 3900
  strict_max_objects: false
  hit_filter_threshold: 0.1
  dummy_data: false
name: timing-trim
matmul_precision: high
optimizer: null
lr_scheduler: null
ckpt_path: null
