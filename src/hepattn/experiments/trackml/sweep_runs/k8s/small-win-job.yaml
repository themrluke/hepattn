# Smaller windows (16, 8), baseline and OR, seeds 42-44, plus the 2-layer seed-42 pair of the depth study: 30 epochs per run, two at a time on one H100, then each run is evaluated on the test set as it finishes.
# Runs: sweep_runs/smallwin.runs; queue sweep_runs/queue_job.sh, evaluation eval_results/auto_eval_study.sh.
# Lifetime 7d (the maximum the cluster accepts). Restart-safe: resubmitting resumes interrupted runs (same Comet experiment).
#
#   kubectl create -f sweep_runs/k8s/small-win-job.yaml        # submit (or resubmit after the 7-day lifetime)
#   kubectl get pods -n ljohnson -l job-name=small-win           # status
#   tail sweep_runs/queue_smallwin.log                         # what the queue is doing (run logs: logs/*_full.out)
#   ls sweep_runs/smallwin_state/                              # finished runs (.done / .diverged / .gaveup)
#   kubectl delete job small-win -n ljohnson                     # stop (runs resume on resubmission)
apiVersion: batch/v1
kind: Job
metadata:
  name: small-win
  namespace: ljohnson
spec:
  backoffLimit: 3            # a crashed container restarts the script, which resumes the runs
  template:
    metadata:
      labels:
        lifetime: "7d"
        mount-eos: "true"
        mount-cvmfs: "true"
        home: "eos"
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsUser: 173047, runAsGroup: 1307}
      nodeSelector: {nvidia.com/gpu.product: NVIDIA-H100-NVL}
      containers:
      - name: train
        image: registry.cern.ch/ngt/lxplus-like:9
        workingDir: /shared/projects/hepattn/src/hepattn/experiments/trackml
        command: ["bash", "-c"]
        args:
        - |
          # explicit cd: the EOS-home pod default overrides workingDir
          cd /shared/projects/hepattn/src/hepattn/experiments/trackml || exit 1
          bash eval_results/auto_eval_study.sh smallwin > eval_results/auto_eval_smallwin.out 2>&1 &
          bash sweep_runs/queue_job.sh smallwin; rc=$?
          wait
          exit $rc
        resources:
          # Same as the notebook session: one H100 with its 46 CPUs (even, as the nodes need) and 180 GB
          requests: {cpu: "46", memory: 180G, nvidia.com/gpu: 1}
          limits: {cpu: "46", memory: 180G, nvidia.com/gpu: 1}
        volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: dshm, mountPath: /dev/shm}          # matcher shared-memory buffers and DataLoader workers
        - {name: scratch, mountPath: /scratch}
      volumes:
      - name: shared
        persistentVolumeClaim: {claimName: shared}
      - name: dshm
        emptyDir: {medium: Memory}
      - name: scratch
        emptyDir: {sizeLimit: 450G}
